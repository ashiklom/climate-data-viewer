[project]
name = "prism-mirror"
version = "0.1.0"
description = "Tools for mirroring PRISM climate data into Icechunk"
authors = [
    { name = "Alexey Shiklomanov", email = "alexey.shiklomanov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cast-value-rs>=0.5.1",
    "dask>=2026.8.0",
    "httpx>=0.28.1",
    "icechunk>=2.3.1",
    "numcodecs[pcodec]>=0.17.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "rasterio>=1.5.2",
    "rioxarray>=0.24.0",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
    "zarr>=3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
