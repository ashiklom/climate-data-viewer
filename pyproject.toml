[project]
name = "climate-mirror"
version = "0.1.0"
description = "Cloud-native (Icechunk) mirrors of climate datasets, with sizing studies and a comparison website"
authors = [
    { name = "Alexey Shiklomanov", email = "alexey.shiklomanov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "cast-value-rs>=0.5.1",
    "cdsapi>=0.7.7",
    "dask>=2026.8.0",
    "h5netcdf>=1.8.2",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "icechunk>=2.3.1",
    "numcodecs[pcodec]>=0.17.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "rioxarray>=0.24.0",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
    "zarr>=3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
