[package]
name = "pco-wasm"
version = "0.1.0"
edition = "2021"
description = "Decode-only WebAssembly build of pcodec (pco standalone format, as written by numcodecs.pcodec)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pco = "=1.0.4"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
